<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#FF5900;--hdr:#411517;--bg:#F4EDE3;--surf:#fff;--lime:#CFFF00;
  --text:#411517;--text2:#6b4a46;--muted:#9a8579;--bdr:#e8ddd3;--soft:#faf6f0;
  --ok:#2d7a2d;--ok-bg:#edf7ed;--warn:#b07800;--warn-bg:#fff8e6;--bad:#c0392b;--bad-bg:#fef0f0;
  --sh:0 1px 2px rgba(65,21,23,.06),0 4px 14px rgba(65,21,23,.07);--r:14px}
body{font-family:'Poppins','Noto Sans Arabic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:48px;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
.hidden{display:none!important}

/* top bar */
.topbar{background:var(--hdr);padding:12px 20px;display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:10px;transform:rotate(-4deg);flex-shrink:0;display:block}
.tb-t{color:#fff;font-size:15px;font-weight:700;letter-spacing:.01em}
.tb-s{font-size:10.5px;color:rgba(244,237,227,.55);margin-top:1px}
.stripe{height:4px;background:linear-gradient(90deg,var(--accent) 0,var(--accent) 90%,var(--lime) 90%,var(--lime) 100%)}
.wrap{max-width:940px;margin:0 auto;padding:18px 16px}

/* login */
.lwrap{min-height:calc(100vh - 150px);display:flex;align-items:center;justify-content:center}
.lcard{background:var(--surf);border-radius:20px;box-shadow:var(--sh);padding:30px 26px;width:100%;max-width:440px;border:1px solid var(--bdr)}
.llogo{width:64px;height:64px;border-radius:16px;transform:rotate(-4deg);display:block;margin:0 auto 14px}
.ct{font-size:19px;font-weight:700;text-align:center}.cs{font-size:12.5px;color:var(--text2);text-align:center;margin:4px 0 20px}
.slbl{font-size:11px;font-weight:600;color:var(--text2);display:block;margin-bottom:8px}
.olist{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:300px;overflow-y:auto;padding:2px}
.oopt{padding:11px 10px;border:1.5px solid var(--bdr);border-radius:12px;cursor:pointer;font-size:12.5px;font-weight:500;background:var(--soft);color:var(--text);transition:all .15s;text-align:center}
.oopt:hover{border-color:var(--accent);background:#fff;color:var(--accent);transform:translateY(-1px)}
.selbdg{background:#fff4ed;border:1.5px solid var(--accent);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:700;color:var(--accent);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.lnk{font-size:11.5px;color:var(--muted);background:none;border:none;cursor:pointer}.lnk:hover{color:var(--accent)}
.pinp{width:100%;padding:13px 14px;border:1.5px solid var(--bdr);border-radius:12px;font-size:16px;text-align:center;background:var(--soft);color:var(--text);outline:none;letter-spacing:2px;margin-bottom:12px}
.pinp:focus{border-color:var(--accent);background:#fff}
.lbtn{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:14.5px;font-weight:700;cursor:pointer;transition:filter .15s}
.lbtn:hover{filter:brightness(.95)}.lbtn:disabled{opacity:.55;cursor:not-allowed}
.err{color:var(--bad);font-size:12px;margin-top:10px;text-align:center;min-height:16px;font-weight:500}
.alink{display:block;text-align:center;margin-top:18px;font-size:11.5px;color:var(--muted);cursor:pointer}.alink:hover{color:var(--accent)}

/* office header */
.ohdr{background:var(--hdr);border-radius:var(--r);padding:16px 18px;color:#fff;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:var(--sh)}
.oname{font-size:19px;font-weight:700}
.oupd{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:rgba(244,237,227,.7);margin-top:4px}
.oupd::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime)}
.btns{display:flex;gap:8px}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:7px 14px;font-size:12px;font-weight:500;cursor:pointer;transition:background .15s}
.hbtn:hover{background:rgba(255,255,255,.22)}
.stale{background:var(--bad-bg);border:1px solid rgba(192,57,43,.25);color:var(--bad);border-radius:12px;padding:10px 16px;margin-bottom:14px;font-size:12.5px;font-weight:600}

/* day segmented */
.tabs{display:flex;gap:4px;margin-bottom:14px;background:#ebe1d4;border-radius:12px;padding:4px}
.tab{flex:1;padding:9px 6px;border:none;border-radius:9px;background:transparent;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;text-align:center;line-height:1.3;transition:all .15s}
.tab:hover{color:var(--accent)}.tab.act{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(255,89,0,.35)}
.tab small{display:block;font-size:10px;font-weight:500;opacity:.8}

/* KPI */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.scard{background:var(--surf);border:1.5px solid transparent;border-radius:var(--r);padding:14px 14px 12px;box-shadow:var(--sh);cursor:pointer;transition:all .15s;text-align:right}
.scard:hover{border-color:var(--accent);transform:translateY(-1px)}
.scard.zact{border-color:var(--accent);background:#fff8f4}
.scard.tot{cursor:default;grid-column:span 2;background:var(--hdr);color:#fff}
.scard.tot:hover{border-color:transparent;transform:none}
.szone{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tot .szone{color:rgba(244,237,227,.7)}
.snum{font-size:22px;font-weight:700;line-height:1.1;margin-bottom:8px;direction:ltr;text-align:right}
.snum span.t{color:var(--muted);font-size:13px;font-weight:500}
.tot .snum{font-size:28px}.tot .snum span.t{color:rgba(244,237,227,.55)}
.bar{height:6px;background:#efe6da;border-radius:6px;overflow:hidden;margin-bottom:8px}
.tot .bar{background:rgba(255,255,255,.15)}
.bar i{display:block;height:100%;border-radius:6px}
.spct{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700}
.up{color:var(--ok);font-size:9px;font-weight:700;vertical-align:super}.dn{color:var(--bad);font-size:9px;font-weight:700;vertical-align:super}

/* live strip */
.live{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surf);border-radius:var(--r);box-shadow:var(--sh);padding:11px 14px;margin-bottom:16px;font-size:12px}
.live b{font-size:12px;margin-left:4px}
.lp{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-weight:600;font-size:11.5px;border:1.5px solid transparent;cursor:pointer;font-family:inherit;transition:all .15s}
.lp:hover{border-color:currentColor}.lp.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,89,0,.25)}
td .lp,th .lp{cursor:default}
.lp.w{background:var(--ok-bg);color:var(--ok)}.lp.i{background:var(--warn-bg);color:var(--warn)}.lp.b{background:#eef0f4;color:#4a5568}.lp.x{background:var(--bad-bg);color:var(--bad)}

/* toolbar */
.tool{background:var(--surf);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.stit{font-size:14px;font-weight:700}
.sinp{width:100%;padding:11px 14px;border:1.5px solid var(--bdr);border-radius:12px;font-size:12.5px;background:var(--soft);color:var(--text);outline:none;margin-bottom:10px}
.sinp:focus{border-color:var(--accent);background:#fff}
.frow{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.frow:last-child{margin-bottom:0}
.fbtn{padding:5px 14px;border:1.5px solid var(--bdr);border-radius:20px;font-size:11.5px;font-weight:500;background:var(--surf);color:var(--text);cursor:pointer;transition:all .15s}
.fbtn:hover{border-color:var(--accent);color:var(--accent)}.fbtn.act{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.cnt{font-size:11.5px;color:var(--muted);margin:2px 4px 8px}

/* table */
.tcard{background:var(--surf);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{padding:11px 12px;font-size:10.5px;font-weight:600;color:var(--muted);background:var(--soft);border-bottom:1px solid var(--bdr);text-align:right;white-space:nowrap;letter-spacing:.02em}
td{padding:11px 12px;font-size:12.5px;border-top:1px solid #f1e9de;text-align:right;vertical-align:middle}
tbody tr:hover td{background:#fffaf6}
tr.nb td:first-child{box-shadow:inset -3px 0 0 var(--bad)}
.bdg.cash{background:var(--bad);color:#fff}
tr.cb td{background:#fff1ef}
tbody tr.cb:hover td{background:#ffe6e2}
.rc.cb{background:#fff4f2;box-shadow:inset -4px 0 0 var(--bad),var(--sh)}
.bdg{display:inline-block;padding:3px 10px;border-radius:20px;font-size:10.5px;font-weight:600;white-space:nowrap}
.by{background:var(--ok-bg);color:var(--ok)}.bn{background:var(--bad-bg);color:var(--bad)}.bw{background:var(--warn-bg);color:var(--warn)}.bg{background:#eef0f4;color:#4a5568}
.nor,.ldg{text-align:center;padding:28px;color:var(--muted);font-size:12.5px}
.wa{color:var(--accent);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:5px;direction:ltr}
.wa svg{width:14px;height:14px;flex-shrink:0}
.cp{cursor:pointer;font-size:10px;color:var(--muted);padding:2px 7px;border-radius:6px;border:1px solid var(--bdr);margin-right:6px;background:var(--soft)}
.idc{cursor:pointer}.idc:hover{color:var(--accent);text-decoration:underline}
.cp:hover{color:var(--accent);border-color:var(--accent)}
.rcards{display:none;flex-direction:column;gap:10px}
.rc{background:var(--surf);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh)}
.rc.nb{box-shadow:inset -4px 0 0 var(--bad),var(--sh)}
.rct{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:9px}.rcn{font-size:13.5px;font-weight:600;line-height:1.35}.rci{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}
.rcm{display:flex;flex-wrap:wrap;gap:8px 12px;font-size:11.5px;color:var(--text2);align-items:center}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--hdr);color:#fff;padding:9px 22px;border-radius:24px;font-size:13px;opacity:0;transition:all .25s;z-index:999;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* admin */
.flag{border-radius:12px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.flag.r{background:var(--bad-bg);border:1px solid rgba(192,57,43,.2)}.flag.y{background:var(--warn-bg);border:1px solid rgba(176,120,0,.2)}
.flag b{flex:1;font-size:13px}.flag span{font-size:11.5px}.flag.r span{color:var(--bad)}.flag.y span{color:var(--warn)}
.zg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.zc{background:var(--surf);border-radius:var(--r);padding:13px 14px;box-shadow:var(--sh)}
.zc .szone{text-align:center}.zc .snum{text-align:center}.zc .bar{margin-bottom:8px}
.zc .spct{display:table;margin:0 auto 4px}
.zo{display:flex;align-items:center;gap:6px;padding:5px 2px;font-size:10.5px;border-top:1px solid #f1e9de;margin-top:5px}
.zo .n{flex:1;text-align:right;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--ok);font-weight:600}.wr{color:var(--warn);font-weight:600}.bd{color:var(--bad);font-weight:600}
@media(max-width:640px){
  .wrap{padding:12px 10px}.topbar{padding:10px 14px}
  .tscroll table{display:none}.rcards{display:flex}
  .sgrid{grid-template-columns:repeat(2,1fr)}.zg{grid-template-columns:repeat(2,1fr)}
  .olist{grid-template-columns:1fr 1fr}.oname{font-size:17px}.snum{font-size:20px}.tot .snum{font-size:26px}
}
</style>
</head>

'use strict';
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function digits(s){ return String(s||'').replace(/[^0-9]/g,''); }

// ── crypto (mirror of publish.js in the extension) ───────────────────────────
var te = new TextEncoder();
function unb64(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function hex(buf){ return Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,'0');}).join(''); }
async function officeFile(name){
  var d = await crypto.subtle.digest('SHA-256', te.encode('3pls:'+String(name).trim().toLowerCase()));
  return 'data/'+hex(d).slice(0,16)+'.enc';
}
async function fetchDecrypt(path, pass){
  var r = await fetch(path+'?t='+Math.floor(Date.now()/60000), {cache:'no-store'});
  if(!r.ok) throw {code:'fetch', status:r.status};
  var j = await r.json();
  if(!j || j.v!==1 || !(j.i>0 && j.i<=2000000)) throw {code:'format'};
  var base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(j.s),iterations:j.i,hash:'SHA-256'}, base, {name:'AES-GCM',length:256}, false, ['decrypt']);
  var pt;
  try { pt = await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(j.n)}, key, unb64(j.c)); }
  catch(e){ throw {code:'pass'}; }
  return JSON.parse(new TextDecoder().decode(pt));
}
function errText(e){
  if(e && e.code==='pass') return '❌ باسورد غلط';
  if(e && e.code==='fetch') return e.status===404 ? '❌ مفيش بيانات للمكتب ده لسه' : '❌ تعذر التحميل ('+e.status+')';
  return '❌ خطأ في قراءة البيانات';
}

function pctColor(p){ return p>=.85?'var(--ok)':p>=.65?'#e0a100':'var(--bad)'; }
function staleCheck(el, iso){
  var h = iso ? (Date.now()-new Date(iso).getTime())/3600000 : null;
  if(h===null || isNaN(h) || h<=STALE_HOURS){ el.classList.add('hidden'); el.textContent=''; return; }

      else if(bad===1) wr.push([o,'🟡 أقل من 65% في يوم واحد']); else if(wk>=2) wr.push([o,'🟡 أقل من 85% في '+wk+' أيام']);
      if(x.live && x.live.cash) wr.push([o,'🔒 '+x.live.cash+' طيار كاش بلوك']); });
    h = (!fl.length&&!wr.length) ? '<div class="nor" style="color:var(--ok)">✅ كل المكاتب شغالة كويس</div>' :
      (fl.length?'<div class="stit" style="color:var(--bad);margin-bottom:8px">🔴 تحتاج تدخل</div>'+fl.map(function(f){return '<div class="flag r"><b>'+esc(f[0])+'</b><span>'+f[1]+'</span></div>';}).join(''):'')+
      (wr.length?'<div class="stit" style="color:var(--warn);margin:12px 0 8px">🟡 تستاهل متابعة</div>'+wr.map(function(f){return '<div class="flag y"><b>'+esc(f[0])+'</b><span>'+f[1]+'</span></div>';}).join(''):'');
  } else {
    dayTabs($('atabs'), A.day, d.dates, function(k){ A.day=k; renderAdmin(); });
    var zs=(d.days[A.day]||{zones:{}}).zones, tot=0, tt=0;
    h='<div class="zg">'+Object.keys(zs).sort().map(function(z){
      var arr=zs[z].slice().sort(function(a,b){ return (b.target?b.scheduled/b.target:0)-(a.target?a.scheduled/a.target:0); });
      var s=arr.reduce(function(a,x){return a+x.scheduled;},0), t=arr.reduce(function(a,x){return a+x.target;},0); tot+=s; tt+=t;
      var p=t?s/t:null;
      return '<div class="zc"><div class="szone">'+esc(z)+'</div><div class="snum"><span class="'+(p===null?'':pctCls(p))+'">'+s+'</span><span class="t"> / '+t+'</span></div><div class="bar"><i style="width:'+(p===null?0:Math.min(100,Math.round(p*100)))+'%;background:'+(p===null?'#ddd':pctColor(p))+'"></i></div><span class="spct" style="'+(p===null?'':pctStyle(p))+'">'+(p===null?'—':Math.round(p*100)+'%')+'</span>'+
        arr.map(function(x){ var op=x.target?x.scheduled/x.target:null; return '<div class="zo"><b>'+x.scheduled+'</b><span style="color:var(--muted)">/'+x.target+'</span><span class="spct" style="font-size:9.5px;padding:1px 7px;'+(op===null?'':pctStyle(op))+'">'+(op===null?'—':Math.round(op*100)+'%')+'</span><span class="n">'+esc(x.office)+'</span></div>'; }).join('')+'</div>';
    }).join('')+'</div>';
    h='<div class="sgrid"><div class="scard tot"><div class="szone">الإجمالي الكلي</div><div class="snum"><span style="color:#fff">'+tot+'</span><span class="t"> / '+tt+'</span></div><div class="bar"><i style="width:'+(tt?Math.min(100,Math.round(tot/tt*100)):0)+'%;background:var(--accent)"></i></div>'+(tt?'<span class="spct" style="background:rgba(255,255,255,.15);color:#fff">'+Math.round(tot/tt*100)+'%</span>':'')+'</div></div>'+h;
  }
  $('atabs').classList.toggle('hidden', A.tab!=='zn'); if(A.tab!=='zn') $('atabs').innerHTML='';
  $('acontent').innerHTML = h;
}
</script>
